exclude: "node_modules|.git"
# Svasamm: hooks run at BOTH pre-commit and pre-push. Running them again
# at push guarantees that a `git commit --no-verify` (local bypass) or a
# stale index can't land bad code on the remote. Matches the CRM fork
# + svasamm-research/dms pattern.
default_stages: [pre-commit, pre-push]
# Register hook types so `pre-commit install` sets up:
#   .git/hooks/pre-commit   ← linting before every commit
#   .git/hooks/commit-msg   ← (CI-only commitlint — see note at bottom)
#   .git/hooks/pre-push     ← re-runs pre-commit hooks before push
default_install_hook_types: [pre-commit, commit-msg, pre-push]
fail_fast: false

# Svasamm: use the user's system Node for every language:node hook rather
# than letting pre-commit download its own. On macOS Sequoia some
# pre-commit-bundled Node binaries hit a libc++ ABI mismatch
# (dyld: "Symbol not found: __libcpp_verbose_abort"). setup-node on CI
# and nvm-managed Node locally are both reliably compatible.
default_language_version:
  node: system

# Preserved from upstream frappe/helpdesk v1.22.1 so pre-commit rules match
# what upstream authored (avoids large formatting-drift diffs that would make
# upstream bumps painful). Svasamm additions below are scoped additions only:
#   1. no-commit-to-branch blocks both develop + main (Svasamm branching policy)
#   2. commitlint config (commitlint.config.cjs) drives CI-side Conventional
#      Commits validation — NOT a local pre-commit hook because the Node
#      binary tries to install its own libc++ and fails on macOS Sequoia
#      (see CRM fork Phase 1 commits). CI (linters.yml::semantic-commits)
#      enforces Conventional Commits on every PR regardless.
#
# If upstream bumps their pre-commit rules, we pick those up on the next
# upstream merge into svasamm/base.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: no-commit-to-branch
        # Svasamm: block our integration branch (svasamm/develop) and main.
        # `develop` is retained during the rename transition in case anyone
        # has an old local `develop` branch; once upstream's develop is no
        # longer present in any local clone, this entry should be dropped.
        args:
          - "--branch"
          - "svasamm/develop"
          - "--branch"
          - "main"
          - "--branch"
          - "develop"

  # Svasamm: bumped from upstream helpdesk v1.22.1's pinned 22.6.0 to
  # support Python 3.14 (pinned 22.6.0 raises "no current event loop"
  # under 3.12+). Style is backward-compatible.
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        types_or: [python, pyi]

  # Svasamm: bumped from upstream helpdesk v1.22.1's pinned 5.0.4 to
  # support Python 3.14 (pinned 5.0.4's pyflakes hits AttributeError
  # on `ast.Str` which was removed in Python 3.12).
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        additional_dependencies:
          - flake8-bugbear
          - flake8-comprehensions
          - flake8-simplify
        args: ['--config', '.github/helpers/.flake8_strict']

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.6.2
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@2.6.2
        types: [file]
        types_or: [javascript, vue, html]

  # Svasamm: bumped from 5.12.0 to 5.13.2 (last isort 5.x release) for
  # compatibility with the newer black version above.
  - repo: https://github.com/timothycrosley/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile, black]

ci:
  autoupdate_schedule: weekly
  skip: []
  submodules: false
