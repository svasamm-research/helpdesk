<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="No tickets yet">
  <defs>
    <linearGradient id="nt-hd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <!-- Background tint -->
  <circle cx="200" cy="150" r="110" fill="#ffedd5" opacity="0.6"/>
  <!-- Chat bubble shape (central, empty) -->
  <g fill="#ffffff" stroke="url(#nt-hd)" stroke-width="3" stroke-linejoin="round">
    <path d="M120 100 Q120 80 140 80 L260 80 Q280 80 280 100 L280 175 Q280 195 260 195 L195 195 L170 220 L170 195 L140 195 Q120 195 120 175 Z"/>
  </g>
  <!-- Three small dots inside bubble (indicating pending but empty messages) -->
  <g fill="#ea580c" opacity="0.4">
    <circle cx="170" cy="137" r="6"/>
    <circle cx="200" cy="137" r="6"/>
    <circle cx="230" cy="137" r="6"/>
  </g>
  <!-- Small check-mark accent top right -->
  <g stroke="#ea580c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6">
    <circle cx="310" cy="95" r="16" stroke-width="2"/>
    <path d="M302 95 L308 101 L318 90"/>
  </g>
</svg>
