<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" width="220" height="48" role="img" aria-label="Svasamm Helpdesk">
  <defs>
    <linearGradient id="hd-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <!-- Mark: speech bubble with checkmark inside. Conveys "customer voice heard + issue resolved". -->
  <g>
    <!-- Speech bubble body with tail on bottom-left -->
    <path d="M5 10 Q5 6 9 6 L37 6 Q41 6 41 10 L41 28 Q41 32 37 32 L19 32 L14 40 L14 32 L9 32 Q5 32 5 28 Z" fill="url(#hd-primary)"/>
    <!-- White checkmark inside bubble -->
    <path d="M13 19 L18 24 L33 12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Wordmark -->
  <text x="52" y="31" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#c2410c" letter-spacing="-0.3">Svasamm Helpdesk</text>
</svg>
